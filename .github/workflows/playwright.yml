  #     - name: Notify Slack
  #       uses: slackapi/slack-github-action@v2.0.0
  #       env:
  #         SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
  #       if: env.SLACK_WEBHOOK_URL != ''
  #       with:
  #         webhook: ${{ secrets.SLACK_WEBHOOK }}
  #         webhook-type: incoming-webhook
  #         payload: |
  #           {
  #             "text": "Playwright Tests Completed: Status ${{ needs.test.result }}\nEnvironment: ${{ github.event.inputs.environment || 'dev' }}\nTriggered By: ${{ github.actor }}\nRun URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  #           }
